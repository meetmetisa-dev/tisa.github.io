<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">AELIX explainable multimodal ensemble model</title>
  <desc id="desc">Network, visual, user, and advertising inputs move through representation, imbalance correction, four tuned base models, stacking, and SHAP explanations to infer engagement.</desc>
  <rect width="1400" height="1000" fill="#e5efee"/>
  <g font-family="Arial, Helvetica, sans-serif" letter-spacing="0">
    <text x="70" y="72" fill="#617074" font-size="18">2025 · IEEE ACCESS · AELIX</text>
    <text x="70" y="120" fill="#101416" font-size="34" font-weight="700">Technical evidence and human response in one explainable model</text>
    <g transform="translate(70 195)">
      <text x="0" y="0" fill="#101416" font-size="18" font-weight="700">MULTIMODAL INPUT</text>
      <g transform="translate(0 35)" font-size="16">
        <rect width="245" height="70" rx="4" fill="#167d8c"/><text x="24" y="34" fill="#fff" font-weight="700">Network</text><text x="24" y="55" fill="#dff5f6" font-size="13">bitrate · stalls · resolution</text>
        <rect y="88" width="245" height="70" rx="4" fill="#101416"/><text x="24" y="122" fill="#fff" font-weight="700">Visual</text><text x="24" y="143" fill="#c3cbcd" font-size="13">video · screen · emotion</text>
        <rect y="176" width="245" height="70" rx="4" fill="#e6a13a"/><text x="24" y="210" fill="#fff" font-weight="700">User</text><text x="24" y="231" fill="#fff3df" font-size="13">affect · rating · sentiment</text>
        <rect y="264" width="245" height="70" rx="4" fill="#df513d"/><text x="24" y="298" fill="#fff" font-weight="700">Advertising</text><text x="24" y="319" fill="#ffe8e3" font-size="13">duration · cadence · placement</text>
      </g>
      <line x1="0" y1="405" x2="245" y2="405" stroke="#b7c7c6"/>
      <text x="0" y="440" fill="#617074" font-size="14">Four evidence domains enter one</text>
      <text x="0" y="462" fill="#617074" font-size="14">human-centered QoE inference model.</text>
    </g>
    <path d="M345 410 H410" stroke="#8a9698" stroke-width="3" marker-end="url(#arrow3)"/>
    <g transform="translate(430 195)">
      <text x="0" y="0" fill="#101416" font-size="18" font-weight="700">19-STEP AELIX PIPELINE</text>
      <g transform="translate(0 35)">
        <rect width="405" height="105" rx="5" fill="#ffffff" stroke="#b7c7c6"/>
        <text x="24" y="35" fill="#101416" font-size="18" font-weight="700">1 · Representation</text>
        <text x="24" y="65" fill="#617074" font-size="14">encoding · sentiment · advanced metrics</text>
        <text x="24" y="86" fill="#617074" font-size="14">polynomial interaction features</text>
        <rect y="125" width="405" height="105" rx="5" fill="#ffffff" stroke="#b7c7c6"/>
        <text x="24" y="160" fill="#101416" font-size="18" font-weight="700">2 · Balance and reduce</text>
        <text x="24" y="190" fill="#617074" font-size="14">SMOTEENN · scaling · PCA · RFE</text>
        <rect y="250" width="405" height="130" rx="5" fill="#101416"/>
        <text x="24" y="288" fill="#ffffff" font-size="18" font-weight="700">3 · Tune four learners</text>
        <text x="24" y="320" fill="#b8c2c4" font-size="14">DNN · XGBoost · Gradient Boosting</text>
        <text x="24" y="345" fill="#b8c2c4" font-size="14">Random Forest</text>
        <rect y="400" width="405" height="105" rx="5" fill="#df513d"/>
        <text x="24" y="438" fill="#ffffff" font-size="18" font-weight="700">4 · Stack and explain</text>
        <text x="24" y="468" fill="#ffe8e3" font-size="14">Logistic meta-learner · weighted F1 · SHAP</text>
      </g>
    </g>
    <path d="M860 410 H925" stroke="#8a9698" stroke-width="3" marker-end="url(#arrow3)"/>
    <g transform="translate(945 195)">
      <rect width="385" height="575" rx="6" fill="#ffffff" stroke="#b7c7c6"/>
      <text x="30" y="50" fill="#101416" font-size="18" font-weight="700">REPORTED OUTCOMES</text>
      <text x="30" y="120" fill="#167d8c" font-size="50" font-weight="700">0.950</text>
      <text x="30" y="150" fill="#617074" font-size="15">reported accuracy, one configuration</text>
      <text x="30" y="225" fill="#167d8c" font-size="50" font-weight="700">0.994</text>
      <text x="30" y="255" fill="#617074" font-size="15">reported accuracy, advanced configuration</text>
      <line x1="30" y1="295" x2="355" y2="295" stroke="#d0d8d7"/>
      <text x="30" y="365" fill="#df513d" font-size="50" font-weight="700">+55.3%</text>
      <text x="30" y="395" fill="#101416" font-size="16">over ITU-T P.1203 benchmark</text>
      <text x="30" y="462" fill="#e6a13a" font-size="36" font-weight="700">194 participants</text>
      <text x="30" y="492" fill="#617074" font-size="15">120+ regions · 43 synchronized recordings</text>
      <text x="30" y="545" fill="#617074" font-size="13">SHAP makes feature influence inspectable</text>
    </g>
    <text x="70" y="920" fill="#617074" font-size="14">Source: Selma et al., IEEE Access 2025 · DOI 10.1109/ACCESS.2025.3641843</text>
  </g>
  <defs><marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8a9698"/></marker></defs>
</svg>
