<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Human-centered video QoE study design and reported results</title>
  <desc id="desc">A six-step research protocol connects consent, video viewing, facial and screen recording, ratings, comments, and questionnaires with ITU-T P.1203 and machine learning.</desc>
  <rect width="1400" height="900" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" letter-spacing="0">
    <text x="70" y="72" fill="#617074" font-size="18">2024 · TECHNOLOGIES 12(5), 62</text>
    <text x="70" y="118" fill="#101416" font-size="34" font-weight="700">A study protocol that measures both delivery and experience</text>
    <g transform="translate(70 185)">
      <g>
        <circle cx="45" cy="45" r="42" fill="#101416"/><text x="45" y="52" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text>
        <text x="105" y="36" fill="#101416" font-size="18" font-weight="700">Consent</text><text x="105" y="62" fill="#617074" font-size="14">Read study terms; opt in or leave</text>
      </g>
      <path d="M45 100 V135" stroke="#c7cecf" stroke-width="3"/>
      <g transform="translate(0 145)">
        <circle cx="45" cy="45" r="42" fill="#167d8c"/><text x="45" y="52" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text>
        <text x="105" y="36" fill="#101416" font-size="18" font-weight="700">Watch</text><text x="105" y="62" fill="#617074" font-size="14">Five videos with controlled advertising</text>
      </g>
      <path d="M45 245 V280" stroke="#c7cecf" stroke-width="3"/>
      <g transform="translate(0 290)">
        <circle cx="45" cy="45" r="42" fill="#e6a13a"/><text x="45" y="52" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text>
        <text x="105" y="36" fill="#101416" font-size="18" font-weight="700">Record</text><text x="105" y="62" fill="#617074" font-size="14">Face · screen · network statistics</text>
      </g>
      <path d="M45 390 V425" stroke="#c7cecf" stroke-width="3"/>
      <g transform="translate(0 435)">
        <circle cx="45" cy="45" r="42" fill="#df513d"/><text x="45" y="52" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text>
        <text x="105" y="36" fill="#101416" font-size="18" font-weight="700">Respond</text><text x="105" y="62" fill="#617074" font-size="14">Rate · comment · complete questionnaire</text>
      </g>
    </g>
    <g transform="translate(530 185)">
      <rect width="345" height="500" rx="6" fill="#f0f3f2"/>
      <text x="30" y="48" fill="#101416" font-size="18" font-weight="700">MULTIMODAL EVIDENCE</text>
      <g transform="translate(30 88)" font-size="15">
        <rect width="285" height="54" rx="3" fill="#dceced"/><text x="18" y="34" fill="#126f7a">ITU-T P.1203 estimate</text>
        <rect y="70" width="285" height="54" rx="3" fill="#f8e6c9"/><text x="18" y="104" fill="#8a5a11">Facial emotion recognition</text>
        <rect y="140" width="285" height="54" rx="3" fill="#f6ddd8"/><text x="18" y="174" fill="#9b392b">Advertisement exposure</text>
        <rect y="210" width="285" height="54" rx="3" fill="#ffffff"/><text x="18" y="244" fill="#101416">Star ratings and comments</text>
        <rect y="280" width="285" height="54" rx="3" fill="#ffffff"/><text x="18" y="314" fill="#101416">Playback and network statistics</text>
      </g>
      <text x="30" y="464" fill="#617074" font-size="14">Random Forest and feature selection</text>
    </g>
    <path d="M890 435 H945" stroke="#8a9698" stroke-width="3" marker-end="url(#arrow2)"/>
    <g transform="translate(960 185)">
      <rect width="370" height="500" rx="6" fill="#101416"/>
      <text x="32" y="50" fill="#ffffff" font-size="18" font-weight="700">PUBLISHED EVIDENCE</text>
      <text x="32" y="118" fill="#e6a13a" font-size="49" font-weight="700">661</text>
      <text x="32" y="148" fill="#c3cbcd" font-size="15">participants reached</text>
      <text x="205" y="118" fill="#e6a13a" font-size="49" font-weight="700">114</text>
      <text x="205" y="148" fill="#c3cbcd" font-size="15">countries</text>
      <line x1="32" y1="190" x2="338" y2="190" stroke="#3f4a4d"/>
      <text x="32" y="260" fill="#df513d" font-size="49" font-weight="700">+37.1%</text>
      <text x="32" y="292" fill="#ffffff" font-size="16">accuracy over P.1203 reference</text>
      <text x="32" y="368" fill="#1aa6b7" font-size="44" font-weight="700">+21.74%</text>
      <text x="32" y="400" fill="#ffffff" font-size="16">after attribute selection</text>
      <text x="32" y="468" fill="#879497" font-size="13">125 completed questionnaires reported</text>
    </g>
    <text x="70" y="830" fill="#617074" font-size="14">Source: Selma et al., Technologies 2024 · DOI 10.3390/technologies12050062</text>
  </g>
  <defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8a9698"/></marker></defs>
</svg>
