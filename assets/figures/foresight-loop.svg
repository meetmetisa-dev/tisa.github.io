<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">QoE-Foresight closed-loop prediction, drift detection, self-healing, and explanation</title>
  <desc id="desc">Multimodal telemetry feeds EMMA and a Ridge predictor. Residuals go to HDDE, alarms to a DDQN controller, actions return to the streaming system, and SHAP explains decisions.</desc>
  <rect width="1400" height="920" fill="#f6f6f2"/>
  <g font-family="Arial, Helvetica, sans-serif" letter-spacing="0">
    <rect x="70" y="55" width="270" height="34" rx="3" fill="#f2d9d4"/><text x="86" y="78" fill="#9b392b" font-size="14" font-weight="700">SUBMITTED · NOT YET PEER-REVIEWED</text>
    <text x="70" y="137" fill="#101416" font-size="34" font-weight="700">A model that monitors its own validity</text>
    <g transform="translate(70 205)">
      <rect width="230" height="100" rx="5" fill="#dceced" stroke="#167d8c"/>
      <text x="24" y="38" fill="#101416" font-size="18" font-weight="700">Multimodal telemetry</text>
      <text x="24" y="67" fill="#617074" font-size="14">video · network · device</text>
      <text x="24" y="88" fill="#617074" font-size="14">playback · buffer · content</text>
      <path d="M230 50 H305" stroke="#8a9698" stroke-width="3" marker-end="url(#arrow4)"/>
      <g transform="translate(320 0)"><rect width="210" height="100" rx="5" fill="#167d8c"/><text x="24" y="43" fill="#fff" font-size="19" font-weight="700">EMMA + Ridge</text><text x="24" y="70" fill="#dff5f6" font-size="14">fused QoE prediction</text></g>
      <path d="M530 50 H605" stroke="#8a9698" stroke-width="3" marker-end="url(#arrow4)"/>
      <g transform="translate(620 0)"><rect width="210" height="100" rx="5" fill="#e6a13a"/><text x="24" y="43" fill="#fff" font-size="19" font-weight="700">HDDE</text><text x="24" y="70" fill="#fff3df" font-size="14">hybrid residual drift</text></g>
      <path d="M830 50 H905" stroke="#8a9698" stroke-width="3" marker-end="url(#arrow4)"/>
      <g transform="translate(920 0)"><rect width="210" height="100" rx="5" fill="#df513d"/><text x="24" y="43" fill="#fff" font-size="19" font-weight="700">DDQN controller</text><text x="24" y="70" fill="#ffe8e3" font-size="14">select recovery action</text></g>
      <path d="M1130 50 H1205" stroke="#8a9698" stroke-width="3" marker-end="url(#arrow4)"/>
      <g transform="translate(1220 0)"><rect width="110" height="100" rx="5" fill="#101416"/><text x="55" y="43" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">ACT</text><text x="55" y="70" text-anchor="middle" fill="#bdc5c7" font-size="13">heal QoE</text></g>
      <path d="M1275 115 V190 H115 V115" fill="none" stroke="#df513d" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrowRed)"/>
      <text x="560" y="220" fill="#9b392b" font-size="14">closed-loop feedback: observe → predict → detect → recover → observe again</text>
    </g>
    <g transform="translate(70 520)">
      <rect width="1260" height="95" rx="5" fill="#101416"/>
      <text x="28" y="38" fill="#ffffff" font-size="18" font-weight="700">SHEM · SHAP EXPLAINABILITY</text>
      <text x="28" y="67" fill="#b9c2c4" font-size="15">Global and local attributions explain QoE predictions, drift alarms, and adaptation decisions.</text>
    </g>
    <g transform="translate(70 660)">
      <text x="0" y="0" fill="#101416" font-size="18" font-weight="700">MANUSCRIPT-REPORTED RESULTS</text>
      <g transform="translate(0 30)">
        <rect width="290" height="110" rx="4" fill="#ffffff" stroke="#d0d5d4"/><text x="24" y="48" fill="#167d8c" font-size="38" font-weight="700">R² ≈ 0.953</text><text x="24" y="78" fill="#617074" font-size="14">QoE prediction</text>
        <rect x="315" width="290" height="110" rx="4" fill="#ffffff" stroke="#d0d5d4"/><text x="339" y="48" fill="#e6a13a" font-size="38" font-weight="700">F1 ≈ 0.967</text><text x="339" y="78" fill="#617074" font-size="14">drift detection · 0.035 s delay</text>
        <rect x="630" width="290" height="110" rx="4" fill="#ffffff" stroke="#d0d5d4"/><text x="654" y="48" fill="#df513d" font-size="38" font-weight="700">91% recovery</text><text x="654" y="78" fill="#617074" font-size="14">controlled drift replay</text>
        <rect x="945" width="315" height="110" rx="4" fill="#ffffff" stroke="#d0d5d4"/><text x="969" y="48" fill="#101416" font-size="38" font-weight="700">+0.73 MOS</text><text x="969" y="78" fill="#617074" font-size="14">mean reported QoE gain</text>
      </g>
    </g>
    <text x="70" y="866" fill="#617074" font-size="14">Source: QoE-Foresight submitted manuscript, 2026 · results await peer review.</text>
  </g>
  <defs><marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8a9698"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#df513d"/></marker></defs>
</svg>
